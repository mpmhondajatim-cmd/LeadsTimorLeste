<!DOCTYPE html>
<html lang="tet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formuláriu Sosa Motór</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  
  <style>
    :root { --honda-red: #E4002B; }
    body { background-color: #f4f4f4; padding: 20px 10px; font-family: 'Segoe UI', sans-serif; }
    .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 650px; margin: auto; border-top: 6px solid var(--honda-red); }
    h4 { color: var(--honda-red); font-weight: 800; text-align: center; margin-bottom: 25px; text-transform: uppercase; }
    .btn-honda { background-color: var(--honda-red); color: white; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 6px; }
    .btn-honda:hover { background-color: #b30022; }
    .btn-honda:disabled { background-color: #ccc; }
    .asterisk { color: var(--honda-red); }
    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
    
    /* Perapihan Select2 agar sesuai Bootstrap */
    .select2-container--default .select2-selection--single { height: 38px; border: 1px solid #ced4da; border-radius: 6px; }
    .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 36px; padding-left: 12px; }
    
    /* Gaya Kotak Privasi */
    .privacy-box { 
      background-color: #f8f9fa; 
      border: 1px solid #dee2e6; 
      border-radius: 8px; 
      padding: 15px; 
      font-size: 0.85rem; 
      line-height: 1.5; 
      color: #555;
      text-align: justify;
    }
  </style>
</head>
<body>

<div id="loader" class="loader"><div class="spinner-border text-danger"></div></div>

<div class="text-center mb-3">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Honda_Logo.svg/1024px-Honda_Logo.svg.png" style="width: 60px;">
</div>

<div class="form-container">
  <h4>Pemesanan Motór</h4>
  <form id="leadForm">
    
    <div class="mb-3">
      <label class="form-label">Naran Kompletu <span class="asterisk">*</span></label>
      <input type="text" name="nama" id="nama" class="form-control" placeholder="Hakerek naran tuir KTP" required oninput="validateForm()">
    </div>

    <div class="mb-3">
      <label class="form-label">Númeru WhatsApp <span class="asterisk">*</span></label>
      <input type="tel" name="wa" id="wa" class="form-control" placeholder="Ezemplu: 77xxxxxx" required oninput="cleanNumbers(this); validateForm()">
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Município <span class="asterisk">*</span></label>
        <select name="municipio" id="municipio" class="form-select select2" required onchange="updatePosto()">
          <option value="">Hili...</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Posto Administrativo <span class="asterisk">*</span></label>
        <select name="posto" id="posto" class="form-select select2" disabled required onchange="validateForm()">
          <option value="">Hili...</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Tipu Motór <span class="asterisk">*</span></label>
      <select name="motor" id="motor" class="form-select select2" required onchange="validateForm()">
        <option value="">Hili...</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Estimasaun Sosa <span class="asterisk">*</span></label>
      <select name="estimasi" id="estimasi" class="form-select" required onchange="validateForm()">
        <option value="">Hili...</option>
        <option value="1-2 Minggu">Semana 1-2</option>
        <option value="3-4 Minggu">Semana 3-4</option>
        <option value="Liu Fulan 1">Liu fulan 1</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Eventu / Fonte <span class="asterisk">*</span></label>
      <select name="event" id="event" class="form-select select2" required onchange="validateForm()">
        <option value="">Hili...</option>
      </select>
    </div>

    <div class="privacy-box mb-3">
      <strong>Polítika Privasidade:</strong><br>
      Ho hanehan formuláriu ne'e, Ita fó kbiit ba ami-nia ekipa atu kontaktu Ita liuhosi WhatsApp ka telefone kona-ba informasaun produtu no promozaun. Ami kompromete atu proteje Ita-nia dadus pesoál ho seguru.
    </div>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="agree" required onchange="validateForm()">
      <label class="form-check-label small" for="agree">
        Ha'u konkorda ho polítika dadus <span class="asterisk">*</span>
      </label>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-honda" disabled>HARUKA FORMULÁRIU</button>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMxvwdf9aX0KRtJkBqepnL4b5J4tnLhwds5AvrI6bWgWnumcG8v_RJYlgYBVZ9O9qouA/exec"; // Ganti dengan URL baru setelah Deploy

  $(document).ready(function() {
    // Inisialisasi Searchbox (Select2)
    $('.select2').select2({ width: '100%' });

    // Load Data Awal
    loadOptions('getMunicipios', 'municipio');
    loadOptions('getMotorOptions', 'motor');
    loadOptions('getEvents', 'event');
  });

  // Fungsi Pembersihan Angka
  function cleanNumbers(input) {
    input.value = input.value.replace(/\D/g, '');
  }

  async function loadOptions(action, elementId, params = {}) {
    const query = new URLSearchParams({ action, ...params }).toString();
    try {
      const response = await fetch(`${SCRIPT_URL}?${query}`);
      const data = await response.json();
      const $select = $(`#${elementId}`);
      $select.empty().append('<option value="">Hili...</option>');
      data.forEach(item => $select.append(new Option(item, item)));
      $select.trigger('change');
    } catch (e) { console.error(e); }
  }

  function updatePosto() {
    const muni = $('#municipio').val();
    if(muni) {
      $('#posto').prop('disabled', false);
      loadOptions('getPostos', 'posto', { municipio: muni });
    } else {
      $('#posto').prop('disabled', true).val('').trigger('change');
    }
    validateForm();
  }

  function validateForm() {
    const fields = ['nama', 'wa', 'municipio', 'posto', 'motor', 'estimasi', 'event'];
    const allFilled = fields.every(id => $(`#${id}`).val() && $(`#${id}`).val().trim() !== "");
    const agreed = $('#agree').is(':checked');
    $('#submitBtn').prop('disabled', !(allFilled && agreed));
  }

  $('#leadForm').on('submit', async function(e) {
    e.preventDefault();
    $('#loader').css('display', 'flex');
    const formData = Object.fromEntries(new FormData(this));

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(formData)
      });
      alert("Obrigadu! Dadus haruka ona.");
      this.reset();
      $('.select2').val('').trigger('change');
      validateForm();
    } catch (e) {
      alert("Error haruka dadus.");
    } finally {
      $('#loader').hide();
    }
  });
</script>
</body>
</html>
